name: 🔄 Daily Activity Commit

on:
  schedule:
    # Runs at 12:00 AM IST (18:30 UTC) every day
    - cron: '30 18 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  daily-commit:
    name: Commit Daily Activity Log
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity log entry
        run: |
          mkdir -p .github/activity
          DATE=$(date -u '+%Y-%m-%d')
          TIME=$(date -u '+%H:%M UTC')
          DAY=$(date -u '+%A')

          cat > .github/activity/daily_log.md << EOF
          # Activity Log

          > Auto-generated daily log to track consistent engineering activity.

          **Last Updated:** ${DATE} at ${TIME}
          **Day:** ${DAY}
          **Status:** Active — building AI agents, serverless systems, and full-stack products.

          ---

          *Updated automatically via GitHub Actions.*
          EOF

      - name: Commit and push if changed
        run: |
          git config --local user.name "omansayyad29"
          git config --local user.email "omansayyad29@gmail.com"
          git add .github/activity/daily_log.md

          # Only commit if there's something new to commit
          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "chore(activity): daily log update — $(date -u '+%Y-%m-%d')"
            git push
            echo "✅ Daily commit pushed successfully."
          fi
