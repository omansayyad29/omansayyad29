name: Update Profile Stats

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-readme:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update timestamp file
        run: |
          DATE=$(date -u "+%Y-%m-%d")
          TIME=$(date -u "+%H:%M UTC")
          printf "Last updated: %s at %s\n" "$DATE" "$TIME" > last_update.md

      - name: Commit and push
        run: |
          git config user.name "Oman Sayyad"
          git config user.email "omansayyad29@gmail.com"
          git add last_update.md
          git diff --staged --quiet && echo "No changes" || git commit -m "chore: profile stats update $(date -u '+%Y-%m-%d')"
          git push
